<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Prodi TJKT - SMK YASBAM</title>
    <link rel="stylesheet" href="/css/style.css">
<base target="_blank">
</head>
<body>
    <div class="page">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <img src="logo/yasbam.jpg" alt="SMK YASBAM" class="logo logo-sekolah" onerror="this.style.display='none'">
                <div class="header-text">
                    <h1>Absensi Prodi TJKT</h1>
                    <span>SMK YASBAM</span>
                </div>
                <img src="logo/yasbam.jpg" alt="TJKT" class="logo logo-tjkt" onerror="this.style.display='none'">
            </div>
        </header>

        <!-- Main -->
        <main class="main">
            <!-- Search State -->
            <div id="search-state" class="state">
                <div class="search-wrap">
                    <label for="search-input" class="sr-only">Cari nama</label>
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                        </svg>
                        <input
                            type="text"
                            id="search-input"
                            class="search-input"
                            placeholder="Cari nama anggota..."
                            autocomplete="off"
                        >
                    </div>
                </div>

                <div id="search-results" class="results"></div>

                <div id="empty-state" class="empty hidden">
                    <p>Nama tidak ditemukan</p>
                </div>
            </div>

            <!-- Confirmation State -->
            <div id="confirmation-state" class="state hidden">
                <div class="confirm-card">
                    <div class="confirm-avatar" id="confirm-avatar"></div>
                    <p class="confirm-label">Pastikan ini data kamu</p>
                    <p class="confirm-name" id="confirm-name"></p>
                    <div class="confirm-detail">
                        <span>No. Absen <b id="confirm-number"></b></span>
                        <span>Kelas <b id="confirm-class"></b></span>
                    </div>
                    <div class="confirm-actions">
                        <button class="btn btn-outline" id="btn-back" type="button">Batal</button>
                        <button class="btn btn-main" id="btn-confirm" type="button">
                            <span class="btn-text">Saya Hadir</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Success State -->
            <div id="success-state" class="state hidden">
                <div class="result-card success">
                    <div class="result-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <h2>Absensi Berhasil</h2>
                    <div class="result-info">
                        <div class="info-row">
                            <span class="info-label">Nama</span>
                            <span class="info-val" id="success-name"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">No. Absen</span>
                            <span class="info-val" id="success-number"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Waktu</span>
                            <span class="info-val" id="success-time"></span>
                        </div>
                    </div>
                    <button class="btn btn-main btn-wide" id="btn-absen-lagi" type="button">Absen Lagi</button>
                </div>
            </div>

            <!-- Already Attended State -->
            <div id="attended-state" class="state hidden">
                <div class="result-card warn">
                    <div class="result-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>
                    <h2>Sudah Absen</h2>
                    <p class="result-desc">Kamu sudah absen di pertemuan ini. Satu orang hanya boleh absen sekali.</p>
                    <button class="btn btn-main btn-wide" id="btn-back-from-attended" type="button">Kembali</button>
                </div>
            </div>

            <!-- Error State -->
            <div id="error-state" class="state hidden">
                <div class="result-card error">
                    <div class="result-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                    </div>
                    <h2>Terjadi Kesalahan</h2>
                    <p class="result-desc" id="error-message"></p>
                    <button class="btn btn-main btn-wide" id="btn-back-from-error" type="button">Coba Lagi</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>SMK YASBAM &mdash; Prodi TJKT</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
